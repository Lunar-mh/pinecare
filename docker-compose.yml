services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - ./backend/.env
    environment:
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_USER=${DB_USER:-yinban}
      - DB_PASSWORD=${DB_PASSWORD:-yinban_password}
      - DB_NAME=${DB_NAME:-yinban}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - RUNTIME_MODE=${RUNTIME_MODE:-COMPETITION_SANDBOX}
      - COMPETITION_SANDBOX=${COMPETITION_SANDBOX:-1}
      - PRODUCTION_LIVE=${PRODUCTION_LIVE:-0}
    networks:
      - yinban-network
    restart: unless-stopped

  mysql:
    image: mysql:8.0
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_password}
      MYSQL_DATABASE: ${DB_NAME:-yinban}
      MYSQL_USER: ${DB_USER:-yinban}
      MYSQL_PASSWORD: ${DB_PASSWORD:-yinban_password}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - yinban-network
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - yinban-network
    restart: unless-stopped

volumes:
  mysql_data:
    driver: local
  redis_data:
    driver: local

networks:
  yinban-network:
    driver: bridge
