name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  JWT_SECRET: test-jwt-secret-for-ci
  DB_HOST: localhost
  DB_USER: root
  DB_PASSWORD: test-password
  DB_NAME: test_db
  REDIS_HOST: localhost

jobs:
  backend-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Cache backend npm dependencies
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('backend/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Run backend lint
        working-directory: backend
        run: npm run lint

      - name: Run backend format check
        working-directory: backend
        run: npm run format:check

      - name: Run backend tests
        working-directory: backend
        run: npm test
        env:
          JWT_SECRET: ${{ env.JWT_SECRET }}
          DB_HOST: ${{ env.DB_HOST }}
          DB_USER: ${{ env.DB_USER }}
          DB_PASSWORD: ${{ env.DB_PASSWORD }}
          DB_NAME: ${{ env.DB_NAME }}
          REDIS_HOST: ${{ env.REDIS_HOST }}

      - name: Run backend security suite
        working-directory: backend
        run: npm run test:security

      - name: Run backend performance audit
        working-directory: backend
        run: npm run audit:performance

      - name: Run backend fresh-install smoke
        working-directory: backend
        run: npm run smoke:fresh-install

      - name: Run competition seed dry-run verification
        working-directory: backend
        run: npm run seed:competition:verify -- --dry-run

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: backend/coverage
          retention-days: 7

      - name: Upload performance audit
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: performance-audit
          path: backend/generated/audits/performance
          retention-days: 7

  admin-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Cache admin npm dependencies
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('admin/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-

      - name: Install admin dependencies
        working-directory: admin
        run: npm ci

      - name: Build admin
        working-directory: admin
        run: npm run build

  frontend-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Cache frontend npm dependencies
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('frontend/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Run frontend typecheck
        working-directory: frontend
        run: npm run typecheck

      - name: Build frontend weapp
        working-directory: frontend
        run: npm run build:weapp

  volunteer-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Cache volunteer npm dependencies
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('volunteer/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-

      - name: Install volunteer dependencies
        working-directory: volunteer
        run: npm ci

      - name: Run volunteer typecheck
        working-directory: volunteer
        run: npm run typecheck

      - name: Build volunteer
        working-directory: volunteer
        run: npm run build

  docker-build:
    runs-on: ubuntu-latest
    needs: [backend-test, admin-build, frontend-checks, volunteer-checks]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        run: docker build ./backend -t app:${{ github.sha }}
