openapi: 3.0.3
info:
  title: 银伴平台 - 医疗资源整合 API
  version: 1.2.0

servers:
  - url: /api/v1
  - url: /

paths:
  /medical/hospitals:
    get:
      tags: [医疗]
      summary: 获取医院列表
      parameters:
        - $ref: '#/components/parameters/XRequestId'
      responses:
        '200':
          description: 成功

  /medical/departments:
    get:
      tags: [医疗]
      summary: 获取医院科室列表
      parameters:
        - $ref: '#/components/parameters/XRequestId'
        - in: query
          name: hospitalId
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: 成功

  /medical/doctors:
    get:
      tags: [医疗]
      summary: 获取医生列表（支持分页筛选）
      parameters:
        - $ref: '#/components/parameters/XRequestId'
        - in: query
          name: departmentId
          required: true
          schema:
            type: integer
        - in: query
          name: keyword
          schema:
            type: string
        - in: query
          name: page
          schema:
            type: integer
        - in: query
          name: pageSize
          schema:
            type: integer
      responses:
        '200':
          description: 成功

  /medical/doctors/{doctorId}:
    get:
      tags: [医疗]
      summary: 获取医生详情
      parameters:
        - $ref: '#/components/parameters/XRequestId'
        - in: path
          name: doctorId
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: 成功
        '404':
          description: 医生不存在

  /medical/consult/start:
    post:
      tags: [医疗]
      summary: 发起在线问诊
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/XRequestId'
      responses:
        '200':
          description: 成功

  /medical/appointment:
    post:
      tags: [医疗]
      summary: 创建预约
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/XRequestId'
        - $ref: '#/components/parameters/XIdempotencyKey'
      responses:
        '200':
          description: 成功
        '409':
          description: 幂等重放或状态冲突
        '422':
          description: 参数错误
        '503':
          description: 第三方服务不可用
        '504':
          description: 第三方服务超时
    get:
      tags: [医疗]
      summary: 获取我的预约列表
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/XRequestId'
        - in: query
          name: status
          schema:
            type: string
            enum: [pending, confirmed, completed, cancelled]
        - in: query
          name: page
          schema:
            type: integer
        - in: query
          name: pageSize
          schema:
            type: integer
      responses:
        '200':
          description: 成功

  /medical/appointment/{appointmentId}/cancel:
    post:
      tags: [医疗]
      summary: 取消预约
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/XRequestId'
        - in: path
          name: appointmentId
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: 成功
        '404':
          description: 预约不存在
        '409':
          description: 状态不允许取消
        '503':
          description: 第三方服务不可用
        '504':
          description: 第三方服务超时

  /medical/reports:
    get:
      tags: [医疗]
      summary: 获取报告列表（支持分页筛选）
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/XRequestId'
        - in: query
          name: reportType
          schema:
            type: string
        - in: query
          name: startDate
          schema:
            type: string
            format: date
        - in: query
          name: endDate
          schema:
            type: string
            format: date
        - in: query
          name: page
          schema:
            type: integer
        - in: query
          name: pageSize
          schema:
            type: integer
      responses:
        '200':
          description: 成功

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    XRequestId:
      in: header
      name: x-request-id
      required: false
      schema:
        type: string
      description: 客户端请求追踪 ID。服务端会原样回传；缺省时服务端自动生成。
    XIdempotencyKey:
      in: header
      name: x-idempotency-key
      required: false
      schema:
        type: string
      description: 写接口幂等键，建议客户端在重试时复用同一值。
