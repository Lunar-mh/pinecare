openapi: 3.0.3
info:
  title: Yinban Medical Integration API
  description: Medical directory, online consultation, appointment, and report interfaces.
  version: 1.3.0

servers:
  - url: /api/v1
    description: Standard API prefix
  - url: /
    description: Mini-program compatibility prefix

tags:
  - name: Medical
    description: Medical resource integration domain

paths:
  /medical/hospitals:
    get:
      tags: [Medical]
      summary: List hospitals
      operationId: listHospitals
      parameters:
        - $ref: '#/components/parameters/XRequestId'
      responses:
        '200':
          description: Hospital list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HospitalListResponse'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '504':
          $ref: '#/components/responses/GatewayTimeout'

  /medical/departments:
    get:
      tags: [Medical]
      summary: List departments by hospital
      operationId: listDepartments
      parameters:
        - $ref: '#/components/parameters/XRequestId'
        - in: query
          name: hospitalId
          required: true
          schema:
            type: integer
            minimum: 1
      responses:
        '200':
          description: Department list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DepartmentListResponse'
        '422':
          $ref: '#/components/responses/ValidationError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '504':
          $ref: '#/components/responses/GatewayTimeout'

  /medical/doctors:
    get:
      tags: [Medical]
      summary: List doctors with pagination and filters
      operationId: listDoctors
      parameters:
        - $ref: '#/components/parameters/XRequestId'
        - in: query
          name: departmentId
          required: true
          schema:
            type: integer
            minimum: 1
        - in: query
          name: hospitalId
          required: false
          schema:
            type: integer
            minimum: 1
        - in: query
          name: keyword
          required: false
          schema:
            type: string
        - in: query
          name: page
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
        - in: query
          name: pageSize
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 10
      responses:
        '200':
          description: Doctor page
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DoctorPageResponse'
        '422':
          $ref: '#/components/responses/ValidationError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '504':
          $ref: '#/components/responses/GatewayTimeout'

  /medical/doctors/{doctorId}:
    get:
      tags: [Medical]
      summary: Get doctor detail
      operationId: getDoctorDetail
      parameters:
        - $ref: '#/components/parameters/XRequestId'
        - in: path
          name: doctorId
          required: true
          schema:
            type: integer
            minimum: 1
      responses:
        '200':
          description: Doctor detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DoctorDetailResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '504':
          $ref: '#/components/responses/GatewayTimeout'

  /medical/consult/start:
    post:
      tags: [Medical]
      summary: Start online consultation
      operationId: startConsultation
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/XRequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [doctorId, department]
              properties:
                doctorId:
                  type: integer
                  minimum: 1
                department:
                  type: string
      responses:
        '200':
          description: Consultation created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConsultationResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '504':
          $ref: '#/components/responses/GatewayTimeout'

  /medical/appointment:
    post:
      tags: [Medical]
      summary: Create appointment
      operationId: createAppointment
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/XRequestId'
        - $ref: '#/components/parameters/XIdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [hospitalId, department, doctorId, appointmentDate, timeSlot]
              properties:
                hospitalId:
                  type: integer
                  minimum: 1
                department:
                  type: string
                doctorId:
                  type: integer
                  minimum: 1
                appointmentDate:
                  type: string
                  format: date
                timeSlot:
                  type: string
      responses:
        '200':
          description: Appointment created or idempotently replayed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppointmentWriteResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '504':
          $ref: '#/components/responses/GatewayTimeout'
    get:
      tags: [Medical]
      summary: List my appointments
      operationId: listAppointments
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/XRequestId'
        - in: query
          name: status
          required: false
          schema:
            type: string
            enum: [pending, confirmed, completed, cancelled]
        - in: query
          name: page
          required: false
          schema:
            type: integer
            minimum: 1
        - in: query
          name: pageSize
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
      responses:
        '200':
          description: Appointment page
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppointmentListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationError'

  /medical/appointment/{appointmentId}/cancel:
    post:
      tags: [Medical]
      summary: Cancel appointment
      operationId: cancelAppointment
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/XRequestId'
        - in: path
          name: appointmentId
          required: true
          schema:
            type: integer
            minimum: 1
      responses:
        '200':
          description: Appointment cancelled or idempotently replayed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppointmentWriteResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '504':
          $ref: '#/components/responses/GatewayTimeout'

  /medical/reports:
    get:
      tags: [Medical]
      summary: List medical reports
      operationId: listMedicalReports
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/XRequestId'
        - in: query
          name: reportType
          required: false
          schema:
            type: string
        - in: query
          name: startDate
          required: false
          schema:
            type: string
            format: date
        - in: query
          name: endDate
          required: false
          schema:
            type: string
            format: date
        - in: query
          name: page
          required: false
          schema:
            type: integer
            minimum: 1
        - in: query
          name: pageSize
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
      responses:
        '200':
          description: Report page
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MedicalReportListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '504':
          $ref: '#/components/responses/GatewayTimeout'

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    XRequestId:
      in: header
      name: x-request-id
      required: false
      schema:
        type: string
      description: Client request trace ID. The backend echoes it back when present.
    XIdempotencyKey:
      in: header
      name: x-idempotency-key
      required: false
      schema:
        type: string
      description: Recommended idempotency key for retried write requests.

  schemas:
    Envelope:
      type: object
      required: [code, message, data]
      properties:
        code:
          type: integer
          example: 0
        message:
          type: string
          example: ok
        data:
          nullable: true

    ErrorEnvelope:
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - type: object
          properties:
            code:
              type: integer
              example: 422
            message:
              type: string
              example: validation failed
            data:
              nullable: true

    Hospital:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        level:
          type: string
        city:
          type: string

    Department:
      type: object
      properties:
        id:
          type: integer
        hospitalId:
          type: integer
        name:
          type: string

    Doctor:
      type: object
      properties:
        id:
          type: integer
        hospitalId:
          type: integer
          nullable: true
        departmentId:
          type: integer
          nullable: true
        name:
          type: string
        title:
          type: string
          nullable: true
        specialty:
          type: string
          nullable: true

    Consultation:
      type: object
      properties:
        id:
          type: integer
        userId:
          type: integer
        doctorId:
          type: integer
        department:
          type: string
        consultStatus:
          type: string
          enum: [pending, active, completed, cancelled]
        sessionUrl:
          type: string
          nullable: true
        thirdPartySessionId:
          type: string
          nullable: true
        startedAt:
          type: string
          format: date-time
          nullable: true
        endedAt:
          type: string
          format: date-time
          nullable: true

    Appointment:
      type: object
      properties:
        id:
          type: integer
        userId:
          type: integer
        hospitalId:
          type: integer
        department:
          type: string
        doctorId:
          type: integer
        appointmentDate:
          type: string
          format: date
        timeSlot:
          type: string
        appointStatus:
          type: string
          enum: [pending, confirmed, completed, cancelled]
        thirdPartyAppointId:
          type: string
          nullable: true
        idempotencyKey:
          type: string
          nullable: true

    Pagination:
      type: object
      properties:
        page:
          type: integer
        pageSize:
          type: integer
        total:
          type: integer
        totalPages:
          type: integer

    MedicalReport:
      type: object
      properties:
        id:
          type: integer
        userId:
          type: integer
        reportNo:
          type: string
        reportType:
          type: string
        reportDate:
          type: string
          format: date
        reportUrl:
          type: string
          nullable: true
        reportData:
          type: object
          nullable: true
          additionalProperties: true
        syncStatus:
          type: string
        createdAt:
          type: string
          format: date-time
          nullable: true

    HospitalListResponse:
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - type: object
          properties:
            data:
              type: object
              properties:
                source:
                  type: string
                list:
                  type: array
                  items:
                    $ref: '#/components/schemas/Hospital'

    DepartmentListResponse:
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - type: object
          properties:
            data:
              type: object
              properties:
                source:
                  type: string
                list:
                  type: array
                  items:
                    $ref: '#/components/schemas/Department'

    DoctorPageResponse:
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - type: object
          properties:
            data:
              type: object
              properties:
                source:
                  type: string
                list:
                  type: array
                  items:
                    $ref: '#/components/schemas/Doctor'
                page:
                  type: integer
                pageSize:
                  type: integer
                total:
                  type: integer

    DoctorDetailResponse:
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - type: object
          properties:
            data:
              type: object
              properties:
                source:
                  type: string
                doctor:
                  $ref: '#/components/schemas/Doctor'

    ConsultationResponse:
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - type: object
          properties:
            data:
              type: object
              properties:
                consultation:
                  $ref: '#/components/schemas/Consultation'
                source:
                  type: string

    AppointmentWriteResponse:
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - type: object
          properties:
            data:
              type: object
              properties:
                duplicate:
                  type: boolean
                  nullable: true
                idempotent:
                  type: boolean
                  nullable: true
                idempotencyKey:
                  type: string
                  nullable: true
                appointment:
                  $ref: '#/components/schemas/Appointment'

    AppointmentListResponse:
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - type: object
          properties:
            data:
              type: object
              properties:
                list:
                  type: array
                  items:
                    $ref: '#/components/schemas/Appointment'
                total:
                  type: integer
                page:
                  type: integer
                pageSize:
                  type: integer

    MedicalReportListResponse:
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - type: object
          properties:
            data:
              type: object
              properties:
                source:
                  type: string
                list:
                  type: array
                  items:
                    $ref: '#/components/schemas/MedicalReport'
                total:
                  type: integer
                page:
                  type: integer
                pageSize:
                  type: integer

  responses:
    Unauthorized:
      description: Authentication required
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Conflict:
      description: Conflict or invalid state transition
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    ValidationError:
      description: Validation failed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    ServiceUnavailable:
      description: Upstream service unavailable
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    GatewayTimeout:
      description: Upstream service timeout
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
