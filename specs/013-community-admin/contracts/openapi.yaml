openapi: 3.0.3
info:
  title: 银伴平台 - 社区管理 API
  description: 与当前后端实现对齐的社区管理接口契约
  version: 1.1.0

servers:
  - url: /api/v1
  - url: /

tags:
  - name: Community
    description: 社区管理后台接口

paths:
  /community/volunteers:
    get:
      tags: [Community]
      summary: 获取社区志愿者列表
      security:
        - BearerAuth: []
      responses:
        '200':
          description: 成功

  /community/orders:
    get:
      tags: [Community]
      summary: 获取工单列表
      security:
        - BearerAuth: []
      responses:
        '200':
          description: 成功
    post:
      tags: [Community]
      summary: 创建工单
      security:
        - BearerAuth: []
      responses:
        '200':
          description: 成功

  /community/orders/{orderId}:
    get:
      tags: [Community]
      summary: 获取工单详情
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: orderId
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: 成功

  /community/orders/{orderId}/assign:
    patch:
      tags: [Community]
      summary: 分派工单给志愿者
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: orderId
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [volunteer_id]
              properties:
                volunteer_id:
                  type: integer
                scheduled_at:
                  type: string
                  format: date-time
      responses:
        '200':
          description: 成功

  /community/orders/{orderId}/status:
    patch:
      tags: [Community]
      summary: 后台收口工单状态
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: orderId
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status:
                  type: string
                  enum: [cancelled, completed]
                reason:
                  type: string
      responses:
        '200':
          description: 成功

  /community/activities:
    get:
      tags: [Community]
      summary: 获取社区活动列表
      security:
        - BearerAuth: []
      responses:
        '200':
          description: 成功
    post:
      tags: [Community]
      summary: 创建社区活动
      security:
        - BearerAuth: []
      responses:
        '200':
          description: 成功

  /community/stats:
    get:
      tags: [Community]
      summary: 获取社区统计摘要
      security:
        - BearerAuth: []
      responses:
        '200':
          description: 成功

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
