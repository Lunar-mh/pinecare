openapi: 3.0.3
info:
  title: 银伴平台 - 社区管理API
  description: 银伴全域智慧照护平台社区管理接口
  version: 1.0.0

servers:
  - url: https://api.yinban.com/v1

tags:
  - name: 社区管理
    description: 社区管理相关接口

paths:
  /admin/volunteers:
    get:
      tags:
        - 社区管理
      summary: 志愿者列表
      security:
        - BearerAuth: []
      responses:
        '200':
          description: 成功

  /admin/orders:
    get:
      tags:
        - 社区管理
      summary: 工单列表
      security:
        - BearerAuth: []
      responses:
        '200':
          description: 成功

    post:
      tags:
        - 社区管理
      summary: 创建工单
      security:
        - BearerAuth: []
      responses:
        '200':
          description: 成功

  /admin/activities:
    get:
      tags:
        - 社区管理
      summary: 活动列表
      responses:
        '200':
          description: 成功

  /admin/stats:
    get:
      tags:
        - 社区管理
      summary: 数据统计
      security:
        - BearerAuth: []
      responses:
        '200':
          description: 成功

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
