openapi: 3.0.3
info:
  title: 银伴平台 - 家庭空间API
  description: 银伴全域智慧照护平台家庭空间接口
  version: 1.0.0

servers:
  - url: https://api.yinban.com/v1

tags:
  - name: 家庭空间
    description: 家庭空间相关接口

paths:
  /family/message/send:
    post:
      tags:
        - 家庭空间
      summary: 发送语音留言
      security:
        - BearerAuth: []
      responses:
        '200':
          description: 成功

  /family/message/list:
    get:
      tags:
        - 家庭空间
      summary: 留言列表
      security:
        - BearerAuth: []
      responses:
        '200':
          description: 成功

  /family/album/upload:
    post:
      tags:
        - 家庭空间
      summary: 上传照片
      security:
        - BearerAuth: []
      responses:
        '200':
          description: 成功

  /family/album/list:
    get:
      tags:
        - 家庭空间
      summary: 相册列表
      security:
        - BearerAuth: []
      responses:
        '200':
          description: 成功

  /family/points:
    get:
      tags:
        - 家庭空间
      summary: 孝心值查询
      security:
        - BearerAuth: []
      responses:
        '200':
          description: 成功

  /family/leaderboard:
    get:
      tags:
        - 家庭空间
      summary: 家庭排行榜
      responses:
        '200':
          description: 成功

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
