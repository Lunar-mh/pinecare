openapi: 3.0.3
info:
  title: 银伴平台 - 紧急救援API
  description: 银伴平台SOS紧急救援接口
  version: 1.0.0

servers:
  - url: https://api.yinban.com/v1
    description: 生产环境

paths:
  /sos/trigger:
    post:
      tags:
        - SOS
      summary: 触发SOS
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                latitude:
                  type: number
                longitude:
                  type: number
      responses:
        '200':
          description: 触发成功

  /sos/cancel:
    post:
      tags:
        - SOS
      summary: 取消SOS
      security:
        - BearerAuth: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                event_id:
                  type: integer
      responses:
        '200':
          description: 取消成功

  /sos/history:
    get:
      tags:
        - SOS
      summary: 获取SOS历史
      security:
        - BearerAuth: []
      responses:
        '200':
          description: 获取成功

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
