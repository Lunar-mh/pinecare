openapi: 3.0.3
info:
  title: 银伴平台 - AI陪伴API
  description: 银伴全域智慧照护平台AI陪伴接口
  version: 1.0.0

servers:
  - url: https://api.yinban.com/v1

tags:
  - name: AI陪伴
    description: AI陪伴相关接口

paths:
  /companion/chat:
    post:
      tags:
        - AI陪伴
      summary: 开始对话
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - message
              properties:
                message:
                  type: string
      responses:
        '200':
          description: 成功

  /companion/games:
    get:
      tags:
        - AI陪伴
      summary: 获取游戏列表
      responses:
        '200':
          description: 成功

  /companion/game/record:
    post:
      tags:
        - AI陪伴
      summary: 记录游戏成绩
      security:
        - BearerAuth: []
      responses:
        '200':
          description: 成功

  /companion/emotion:
    get:
      tags:
        - AI陪伴
      summary: 获取情绪趋势
      security:
        - BearerAuth: []
      responses:
        '200':
          description: 成功

  /companion/nostalgia:
    get:
      tags:
        - AI陪伴
      summary: 怀旧内容推荐
      parameters:
        - name: decade
          in: query
          schema:
            type: string
      responses:
        '200':
          description: 成功

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
